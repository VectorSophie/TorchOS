---
# local = Calamares' own modules; the second path holds TorchOS's torchpreflight job.
modules-search: [ local, /usr/lib/torchos/calamares/modules ]

instances:
- id: setup
  module: shellprocess
  config: shellprocess_setup.conf
- id: verify
  module: shellprocess
  config: shellprocess_verify.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  # Must stay first: it rejects unsupported configurations before `partition` writes to any disk
  # (a failed job makes Calamares skip every later job).
  - torchpreflight
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - shellprocess@setup
  - grubcfg
  - bootloader
  - shellprocess@verify
  - umount
- show:
  - finished

branding: torchos
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
