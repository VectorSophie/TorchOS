---
# Only the tested path is offered: erase one whole disk, Btrfs, no encryption, no swap partition (zram
# instead). Manual partitioning, ext4/xfs and LUKS stay off until each has its own install test.
# Calamares still offers "alongside"/"replace" on disks that already hold an OS and has no setting to hide
# them; the torchpreflight job rejects those (and BIOS boots) before anything is written.
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
userSwapChoices: [ none ]
initialSwapChoice: none
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: false
initialPartitioningChoice: erase
defaultPartitionTableType: gpt
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs" ]
enableLuksAutomatedPartitioning: false
