---
overwrite: false
keepDistributor: false
prefer_grub_d: false
# Arch ships /etc/default/grub, and grubcfg ignores defaults for an existing file unless this is set.
always_use_defaults: true
defaults:
  GRUB_TIMEOUT: 5
  GRUB_DEFAULT: "0"
  GRUB_TIMEOUT_STYLE: menu
  GRUB_DISTRIBUTOR: "TorchOS"
  GRUB_CMDLINE_LINUX_DEFAULT: "quiet loglevel=3"
  GRUB_DISABLE_RECOVERY: true
  # linux-lts sorts as "newest" and would be the default entry; the regular kernel is the default,
  # LTS stays one menu away as the fallback.
  GRUB_TOP_LEVEL: "/boot/vmlinuz-linux"
  # GRUB 2.16 lists every firmware boot option (PXE, HTTP, shell...) as an "(EFI BootNext)" entry,
  # burying "TorchOS snapshots" in a recovery menu. UEFI Firmware Settings stays.
  GRUB_DISABLE_BOOTNEXT: true
