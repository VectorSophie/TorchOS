---
# Runs from the live system against the mounted target (${ROOT}) after `bootloader`: an independent check
# of the boot chain. A non-zero exit fails the installation. Reading the fallback initramfs images through
# grub-fstest takes a while on slow disks, hence the long timeout.
dontChroot: true
timeout: 900
script:
  - "/usr/lib/torchos/torch-target-verify ${ROOT}"
