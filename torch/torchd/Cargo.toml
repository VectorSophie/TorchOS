[package]
name = "torchd"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[features]
# Development-only crash points for the VM fault-injection tests. Never enabled in packages or ISOs.
fault-injection = []
